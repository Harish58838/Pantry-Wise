name: Backend Security & Performance Assessment

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Dependency Scanning (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          format: 'table'
          output: 'Vulnerability Test Results/dependency-report.md'
          ignore-unfixed: true

      - name: Run Secret Scanning (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Generate Assessment Artifacts
        run: |
          mkdir -p "Vulnerability Test Results"
          echo "# Backend Inventory Map" > "Vulnerability Test Results/backend-inventory.md"
          echo "# Executive Summary" > "Vulnerability Test Results/executive-summary.md"
          echo "# Performance Report" > "Vulnerability Test Results/performance-report.md"
          
      - name: Upload Security Reports
        uses: actions/upload-artifact@v4
        with:
          name: security-audit-reports
          path: Vulnerability Test Results/
